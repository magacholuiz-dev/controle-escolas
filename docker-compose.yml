# MongoDB local. Uso: npm run db   (ou: docker compose up -d)
# URI: mongodb://127.0.0.1:27019/controle-escolas  (porta 27019 para não colidir com o Mongo do Kivoni, que usa 27018)
services:
  mongo:
    image: mongo:7
    container_name: controle-escolas-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"   # só este computador: o Mongo não tem senha
    volumes:
      - controle_escolas_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  controle_escolas_mongo_data:
